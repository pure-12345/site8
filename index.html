<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>照片</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f5; color: #222; }
    header { text-align: center; padding: 32px 16px 20px; background: #fff; border-bottom: 1px solid #eee; }
    header h1 { font-size: 22px; font-weight: 600; }
    header p { margin-top: 6px; color: #888; font-size: 14px; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
    figure { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 20px; }
    figure a { display: block; line-height: 0; }
    figure img { width: 100%; height: auto; display: block; }
    figure figcaption { padding: 10px 14px; font-size: 13px; color: #888; }
  </style>
</head>
<body>
  <header>
    <h1>照片</h1>
    <p>共 2 张 · 点击图片可查看原图</p>
  </header>
  <main>
    <figure>
      <a href="images/IMG_5084.png" target="_blank"><img src="images/IMG_5084.png" alt="照片 1" loading="lazy"></a>
      <figcaption>照片 1</figcaption>
    </figure>
    <figure>
      <a href="images/IMG_5805.jpg" target="_blank"><img src="images/IMG_5805.jpg" alt="照片 2" loading="lazy"></a>
      <figcaption>照片 2</figcaption>
    </figure>
  </main>
</body>
</html>
